html .project-fullname{display:none;position:absolute;left:0;top:100%;z-index:30;width:max-content;max-width:min(420px,70vw);white-space:normal;overflow-wrap:anywhere;padding:8px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px #0002;font-size:12px;line-height:18px}
html .project-name-wrap:hover .project-fullname,html .project-name-wrap:focus-within .project-fullname{display:block}
html .project-purpose{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:18px;white-space:normal}
html #project-results .project-discovery .tags{flex-wrap:wrap;gap:4px}
html #project-results .project-discovery td:last-child{min-width:0}
html .project-card .project-name-wrap{flex:1}html .project-card .cardstats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12px}html .project-card .cardfoot{margin-top:12px}

html .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
html .projects-primary-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
html .projects-toolbar .search{position:relative;min-width:200px;flex:1 1 240px}
html .projects-toolbar .search>.lucide{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;margin:0;pointer-events:none}
html .projects-toolbar .search input{padding-left:31px}
html .project-card-header .card-pin{display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px;width:24px;min-width:24px;height:24px;min-height:24px;padding:5px;border:0;background:transparent;color:var(--muted);box-shadow:none;border-radius:5px}
html .project-card-header .card-pin.active{color:var(--accent);background:var(--soft)}
html .project-card-header .card-pin.active svg{fill:currentColor;fill-opacity:.18}
html .project-card .cardstats>span{display:inline-flex;align-items:center;gap:5px}html .project-card .cardstats svg{width:14px;height:14px}
@media(min-width:1200px){html .projects-toolbar{flex-wrap:nowrap;gap:7px}html .projects-toolbar .search{flex:1 1 220px;min-width:180px;max-width:none}html .projects-toolbar>select{width:120px;min-width:0}html .projects-toolbar .spacer{display:none}}

/* Keep contextual help directly beside its title. */
html .field-help-caption{display:inline-flex;align-items:center;gap:4px;width:max-content;max-width:100%;font-weight:500}
html .field-help-caption>label{margin:0;font:inherit}
html .field-help-row{display:grid;gap:8px;margin-bottom:18px;min-width:0}
html h1>.inline-help,html h2>.inline-help,html h3>.inline-help,html summary>.inline-help,html .field-help-caption>.inline-help{position:relative;inset:auto;margin:0 0 0 4px;vertical-align:middle}
html .organization-layout .settings-body .field-help-row{grid-template-columns:minmax(120px,1fr) minmax(140px,48%);align-items:center;gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--soft)}
html .organization-layout .field-help-row>.field-help-caption{grid-column:1;grid-row:1}

/* Keep the workspace header outside the content scroll. */
html .main{height:calc(100dvh - 16px);min-height:0;overflow:hidden;display:flex;flex-direction:column}
html .main>.topbar{position:relative;top:auto;flex:0 0 44px;z-index:60}

html .organization-layout .settings-nav{top:0}
@media(max-width:620px){html .main{height:calc(100dvh - 8px)}}

/* Explicit inline sizing prevents flex items from shrinking to their contents. */
html .main{min-width:0}

html .main>.content>.settings-layout{width:100%;min-width:0}
html .organization-layout>.settings-body{width:100%;max-width:800px;min-width:0;justify-self:center;box-sizing:border-box}

const btn=(text,action,cls='',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
const badge=(text,cls='')=>`<span class="badge ${cls}">${text}</span>`;
const fmt=n=>(n/1e9).toLocaleString('en',{maximumFractionDigits:2});
const o=()=>M.currentOrg(s), can=(a,p)=>M.canPerformAction(s,a,p), visible=()=>o().projects.filter(p=>M.canAccessProject(s,p));

function save(){localStorage.setItem(KEY,JSON.stringify(s))}

const accountPages=['account','security','developer','myOrganizations'];

function banner(){const r=M.checkCapacity(o());if(r.status==='normal')return '';if(!can('usage'))return `<div class="banner ${r.status}"><div><strong>${r.status==='full'?'组织容量已满，新增实验和文件上传已暂停':'组织存储即将用尽'}</strong><p>请联系 Owner 扩容。</p></div></div>`;return `<div class="banner ${r.status}"><div><strong>${r.status==='full'?'组织容量已满，新增实验和文件上传已暂停':'组织存储即将用尽'}</strong><p>已使用 ${fmt(o().used)} GB / ${fmt(o().capacity)} GB。</p></div>${btn('管理容量 '+icon('arrow'),'nav','small','data-page="usage"')}</div>`}
function pageContent(){const body=rawPageContent();return accountPages.includes(s.page)||orgPages.includes(s.page)?settingsLayout(body):body;}
function orgNavigation(){return nav('settings','常规','settings')+nav('members','成员管理','users')+nav('projectAdmin','项目管理','project')+nav('usage','用量与账单','billing')+nav('trash','项目回收站','trash');}
function settingsLayout(body){body=body.replace(/<h1>/g,'<h2 class="section-title">').replace(/<\/h1>/g,'</h2>');const personal=accountPages.includes(s.page);if(!personal)return `<div class="settings-layout organization-layout"><nav class="settings-nav" aria-label="组织设置导航"><h3>组织设置</h3>${orgNavigation()}</nav><div class="settings-body organization-content page-${s.page}">${body}</div></div>`;return `<div class="settings-layout organization-layout account-layout"><nav class="settings-nav" aria-label="账户设置导航"><h3>账户设置</h3>${nav('account','常规','user')}${nav('security','登录与安全','lock')}${nav('developer','开发者设置','code')}${nav('myOrganizations','我的组织','users')}</nav><div class="settings-body organization-content account-content">${body}</div></div>`;}
function rawPageContent(){switch(s.page){case'myOrganizations':return myOrganizationsPage();case'rolePermissions':return rolePermissionsPage();case'orgOverview':return orgOverviewPage();case'security':return securityPage();case'developer':return developerPage();case'projectAdmin':return adminProjectsPage();case'trash':return trashPage();case'projects':return projectsPage();case'project':return projectPage();case'members':return membersPage();case'usage':return usagePage();case'migration':s.page='members';ui.tab='legacy';return membersPage();case'settings':return settingsPage();case'account':return accountPage();case'profile':return profilePage();case'categories':s.page='projects';return projectsPage();default:s.page='projects';return projectsPage()}}
function isPinned(p){return (s.profiles[s.user]?.pinned||[]).includes(p.id)}
function filtered(){return visible().filter(p=>(!ui.search||(p.name+' '+(p.desc||'')+' '+p.tags.join(' ')).toLowerCase().includes(ui.search.toLowerCase()))&&(ui.scope==='all'||p.scope===ui.scope)&&(ui.tag==='all'||p.tags.includes(ui.tag))).sort((a,b)=>Number(isPinned(b))-Number(isPinned(a))||(ui.sort==='name'?a.name.localeCompare(b.name,'zh'):ui.sort==='size'?b.bytes-a.bytes:(b.lastExperimentAt||'').localeCompare(a.lastExperimentAt||'')));}
function projectsPage(){let ps=filtered();let ts=[...new Set(visible().flatMap(p=>p.tags))];return '<h1 class="sr-only">所有项目</h1>'+banner()+`<div class="toolbar projects-toolbar"><div class="search">${icon('search')}<input id="search" type="search" aria-label="搜索项目名称、描述和分类标签" placeholder="搜索名称、描述、标签…" value="${esc(ui.search)}"></div><select id="scope-filter" aria-label="项目范围">${opt('all','所有可见范围',ui.scope)}${Object.entries(scopes).map(([k,v])=>opt(k,v,ui.scope)).join('')}</select><select id="tag-filter" aria-label="分类标签">${opt('all','所有分类',ui.tag)}${options(ts,ui.tag)}</select><div class="spacer"></div><select id="sort" aria-label="项目排序">${opt('date','最近实验更新',ui.sort)}${opt('name','名称排序',ui.sort)}${opt('size','存储占用',ui.sort)}</select><div class="segments">${btn(icon('list'),'view',ui.view==='list'?'selected':'',`data-value="list" aria-label="列表视图" aria-pressed="${ui.view==='list'}"`)}${btn(icon('grid'),'view',ui.view==='cards'?'selected':'',`data-value="cards" aria-label="卡片视图" aria-pressed="${ui.view==='cards'}"`)}</div><div class="projects-primary-actions">${can('categories')?btn(icon('tag')+' 管理标签','manageTags'):''}${can('create')?btn(icon('plus')+' 创建项目','create','primary'):''}</div></div><div class="viewmeta"><span>${ps.length} 个项目</span>${ui.search||ui.scope!=='all'||ui.tag!=='all'?btn('清除筛选','clear','small ghost'):''}</div><section id="project-results">${ps.length?ui.view==='cards'?`<div class="grid">${ps.map(p=>card(p)).join('')}</div>`:projectTable(ps):empty(visible().length?'没有匹配的项目':'从第一个项目开始',visible().length?'试试其他关键词，或清除当前筛选。':'项目将归属于当前组织，你可以按实验方向整理它们。',btn(visible().length?'清除筛选':'创建项目',visible().length?'clear':'create',can('create')?'primary':''))}</section>`}
function chart(color=0,big=false){let colors=['#7c8eab','#91a69e','#a397b4','#baa990'];let y=[64,61,65,45,49,39,44,29,32,22,26,17,21,14,16,10];if(color===1)y=y.map(v=>79-v*.8);const line=y.map((v,i)=>`${i*20},${v}`).join(' ');return `<svg viewBox="0 0 300 85" preserveAspectRatio="none" aria-label="演示训练趋势" role="img"><polyline points="${line}" fill="none" stroke="${colors[color%4]}" stroke-width="${big?1.2:1.7}" vector-effect="non-scaling-stroke"/><polyline points="${y.map((v,i)=>`${i*20},${v+(i%3)*4+7}`).join(' ')}" fill="none" stroke="${colors[color%4]}" stroke-opacity=".3" stroke-width="1.2"/></svg>`}
function card(p,org=o()){return `<article class="card project-card"><div class="project-card-header"><div class="projectglyph">${icon(p.scope==='MEMBERS'?'lock':'project')}</div>${projectName(p,org)}${btn(icon('pin'),'pinProject','card-pin'+(isPinned(p)?' active':''),`data-id="${p.id}" data-org="${org.id}" aria-pressed="${isPinned(p)}" aria-label="${isPinned(p)?'取消置顶':'置顶'}${esc(p.name)}" title="${isPinned(p)?'取消置顶':'置顶'}"`)}<details class="project-card-menu"><summary aria-label="${esc(p.name)}的更多操作" title="更多操作">${icon('more')}</summary><div class="project-card-actions">${btn(isPinned(p)?'取消置顶':'置顶','pinProject','ghost',`data-id="${p.id}" aria-pressed="${isPinned(p)}"`)}${M.isManager(s,org)?btn('移动项目','moveProject','ghost',`data-id="${p.id}" data-org="${org.id}"`):''}${btn(icon('tag')+' 编辑标签','projectTags','ghost',`data-id="${p.id}" data-org="${org.id}" ${M.canPerformAction(s,'manage',p,org)?'':'disabled'}`)}</div></details></div>${p.desc?`<p class="projectdesc">${esc(p.desc)}</p>`:''}<div class="tags">${p.tags.map(t=>tagMarkup(t,org)).join('')}</div><div class="cardstats"><span aria-label="实验数量 ${p.experiments}" title="实验数量">${icon('chart')}<strong>${p.experiments}</strong></span>${cardUpdate(p,org)}</div><div class="cardfoot"><span aria-label="访问范围：${scopes[p.scope]}">${scopeBadge(p)}</span></div></article>`}

function experimentTime(p){return p.lastExperimentAt?`<time datetime="${esc(p.lastExperimentAt)}">${esc(p.lastExperimentAt.slice(0,10))}</time>`:p.experiments?'未记录':'暂无实验';}
function projectName(p,org=o()){return `<span class="project-name-wrap">${btn(esc(p.name),'open','projecttitle',`data-id="${p.id}" data-org="${org.id}" aria-label="打开项目：${esc(p.name)}" title="${esc(p.name)}"`)}<span class="project-fullname" role="tooltip">${esc(p.name)}</span></span>`;}
function projectTable(ps){return `<div class="tablewrap project-discovery"><table><colgroup><col style="width:48%"><col style="width:14%"><col style="width:11%"><col style="width:7%"><col style="width:15%"><col style="width:5%"></colgroup><thead><tr><th scope="col">项目</th><th scope="col">分类标签</th><th scope="col">访问范围</th><th scope="col">实验数量</th><th scope="col">最近实验更新</th><th scope="col">操作</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${projectName(p)}${p.desc?`<p class="project-purpose">${esc(p.desc)}</p>`:''}</td><td><div class="tags">${p.tags.map(t=>tagMarkup(t)).join('')||'—'}${can('manage',p)?btn(icon('edit'),'projectTags','small ghost tag-edit',`data-id="${p.id}" data-org="${o().id}" aria-label="编辑${esc(p.name)}的分类标签"`):''}</div></td><td>${scopeBadge(p)}</td><td>${p.experiments}</td><td>${experimentTime(p)}</td><td><details class="project-card-menu admin-project-menu"><summary aria-label="${esc(p.name)}的更多操作">${icon('more')}</summary><div class="project-card-actions">${btn(isPinned(p)?'取消置顶':'置顶','pinProject','ghost',`data-id="${p.id}"`)}${M.isManager(s)?btn('移动项目','moveProject','ghost',`data-id="${p.id}"`):''}</div></details></td></tr>`).join('')}</tbody></table></div>`;}
function projectPage(){const p=o().projects.find(p=>p.id===s.projectId);if(!p||!M.canAccessProject(s,p))return empty('没有项目访问权限','链接不会授予访问权。请联系组织管理员，或返回可访问的项目。',btn('返回项目','nav','primary','data-page="projects"'));
 return head(esc(p.name),'',can('manage',p)?btn(icon('settings')+' 项目设置','edit','',`data-id="${p.id}"`):'')+`<div class="row between"><h2>实验 <span class="muted">${p.experiments}</span></h2>${can('write',p)?btn(icon('plus')+' 记录实验','write','primary',`data-id="${p.id}"`):''}</div><div class="tablewrap"><table><thead><tr><th>实验名称</th><th>评估指标</th><th>更新时间</th></tr></thead><tbody><tr><td>${esc(p.name)} / latest</td><td>${esc(p.metric)}</td><td>${esc(p.updated)}</td></tr></tbody></table></div>`}
function membersPage(){if(!can('members'))return denied('成员管理');const org=o(),pending=org.invites.filter(i=>i.status==='pending'),active=org.members.filter(m=>m.status==='active'),disabled=org.members.filter(m=>m.status==='disabled');if(ui.tab==='legacy')return legacyMembersPage();let list=ui.tab==='pending'?org.invites.filter(i=>i.status==='pending'||i.status==='expired'||i.status==='revoked'):org.members.filter(m=>m.status===ui.tab);return head('成员管理'+btn(icon('info'),'rolePermissionsHelp','ghost title-help','aria-label="查看角色与权限" title="角色与权限" aria-haspopup="dialog"'),'在组织内管理协作成员。成员可访问所有「组织成员可见」项目。',btn(icon('plus')+' 邀请成员','invite','primary'))+`<div class="panel row between"><div><h3>${M.countMemberSlots(org)} / ${org.paid?'不限':10} 个名额</h3><p style="margin-top:5px">${active.length} 位已加入 + ${pending.length} 位待邀请 · Owner、只读成员与待邀请均占名额</p></div>${org.paid?badge('成员不限 · 按容量付费','green'):btn('升级组织','nav','','data-page="usage"')}</div><div class="tabs">${[['active','已加入',active.length],['pending','待邀请',pending.length],['disabled','已禁用',disabled.length],['legacy','旧有协作者',(org.legacyCollaborators||[]).filter(c=>c.status!=='added').length]].map(([v,t,n])=>btn(`${t} <span class="muted">${n}</span>`,'membertab',v===ui.tab?'active':'',`data-value="${v}"`)).join('')}</div>${list.length?`<div class="tablewrap"><table><thead><tr><th>成员 / 邮箱</th><th>组织角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(m=>`<tr><td><div class="row"><span class="avatar">${esc((m.name||m.email).slice(0,1))}</span><div>${esc(m.name||m.email)}${m.id===s.user?' <small>你</small>':''}<small style="display:block">${esc(m.email)}</small></div></div></td><td>${ui.tab==='pending'?esc(m.role):btn(esc(m.role==='管理员'?'管理者':m.role)+icon('chevron'),'roleDetails','role-label',`data-id="${m.id}" aria-label="查看${esc(m.name)}的角色详情"`)}</td><td>${badge({active:'已加入',pending:'等待接受',disabled:'协作已禁用',expired:'已过期',revoked:'已撤回'}[m.status],m.status==='active'?'green':'')}</td><td>${ui.tab==='pending'?(m.status==='pending'?btn('预览邀请','previewInvite','small ghost',`data-id="${m.id}"`)+btn('撤回','revoke','small ghost',`data-id="${m.id}"`):btn('重新邀请','reinvite','small',`data-id="${m.id}"`)):m.role==='Owner'?'—':btn(icon('more'),'memberMenu','small ghost member-more',`data-id="${m.id}" aria-label="${esc(m.name)}的更多操作" aria-haspopup="menu"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('此分组暂无成员','邀请、接受或恢复成员后，会显示在对应分组。')}`}
function denied(title){return empty('你没有'+title+'权限','当前组织成员身份无法执行此操作。可切换组织或联系 Owner。',btn('返回项目','nav','primary','data-page="projects"'))}
function usagePage(){if(!can('usage'))return denied('组织用量');const org=o(),r=M.checkCapacity(org);return head('用量与账单','按组织统一结算，存储由所有项目共享。成员数量不产生费用。',M.isOwner(s)?btn('购买容量','buy','primary'):'')+banner()+`<div class="panel"><div class="row between"><div><p>组织已用存储</p><div class="usage-number">${fmt(org.used)} <small>/ ${fmt(org.capacity)} GB</small></div></div><div style="text-align:right">${badge(r.status==='full'?'容量已满':r.status==='warning'?'接近上限':'容量充足',r.status==='normal'?'green':r.status==='full'?'red':'amber')}<p style="margin-top:7px">剩余 ${fmt(Math.max(0,org.capacity-org.used))} GB</p></div></div><div class="usageplot">${org.projects.map((p,i)=>`<i style="width:${p.bytes/org.capacity*100}%;background:${['#7b8da8','#9bada5','#b1a7bf','#c4b8a3'][i%4]}"></i>`).join('')}</div><div class="legend">${org.projects.map((p,i)=>`<span><b style="background:${['#7b8da8','#9bada5','#b1a7bf','#c4b8a3'][i%4]}"></b>${esc(p.name)}</span>`).join('')}</div><div class="row between" style="margin-top:24px"><small>更新于 ${s.now.slice(0,10)} · 1 GB = 1,000,000,000 字节</small>${btn('清理演示数据','cleanup','small')}</div></div><h3 style="margin:25px 0 14px">按项目查看</h3>${usageTable()}${M.isOwner(s)?`${planSummary()}<h3 style="margin:30px 0 15px">账单记录</h3>${org.orders.length?`<div class="tablewrap"><table><thead><tr><th>订单</th><th>目标容量</th><th>演示价格</th><th>状态</th><th></th></tr></thead><tbody>${org.orders.map(x=>`<tr><td>${x.id}</td><td>${x.gb} GB</td><td>¥${x.price}/月</td><td>${{success:'支付成功',failed:'支付失败',cancelled:'已取消',processing:'处理中',pending:'待支付'}[x.status]}</td><td>${x.applied?badge('权益已生效','green'):btn('查看 / 重试','order','small',`data-id="${x.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">暂无账单</div>'}`:''}`}
function settingsPage(){if(!M.isManager(s))return denied('组织设置');const org=o(),details=org.details||{},draft=ui.orgDraft||{name:org.name,...details},editable=M.isOwner(s),disabled=editable?'':'disabled';const field=(label,key,type='text')=>`<div class="org-info-row"><label for="org-${key}">${label}</label><div>${key==='bio'?`<textarea id="org-${key}" name="${key}" maxlength="500" ${disabled}>${esc(draft[key]||'')}</textarea>`:`<input id="org-${key}" name="${key}" type="${type}" value="${esc(draft[key]||'')}" ${key==='name'?'required maxlength="80"':'maxlength="200"'} ${disabled}>`}</div></div>`;return head('常规','组织基本信息与公开资料。',editable?`<div id="org-header-actions" class="row" ${ui.orgDirty?'':'hidden'}>${btn('取消更改','cancelOrgChanges','ghost')}<button class="primary" form="org-form">保存更改</button></div>`:'')+`<form id="org-form" class="panel org-metadata"><div class="org-info-row"><span>头像</span><div class="org-avatar-edit"><span id="org-avatar-preview">${org.avatar?`<img class="settings-avatar" src="${org.avatar}" alt="组织头像">`:`<span class="avatar settings-avatar">${esc(org.name.slice(0,1))}</span>`}</span>${editable?btn(icon('edit'),'uploadOrgAvatar','avatar-edit-button','type="button" aria-label="更换组织头像" title="更换组织头像"'):''}</div></div>${field('组织名称','name')}${field('简介','bio')}${field('机构 / 院校 / 部门','institution')}${field('网站','website','url')}<div class="org-info-row"><span class="region-label">组织数据区<span class="info-tip" tabindex="0" aria-label="创建后不可修改，与公开地区分别记录。">${icon('info')}<span role="tooltip">创建后不可修改，与公开地区分别记录。</span></span></span><div>${org.region==='region-a'?'演示区域 A':'演示区域 B'}</div></div><div class="org-info-row"><label for="org-location">公开地区</label><div><select id="org-location" name="location" ${disabled}>${[...new Set(['',draft.location||'','中国','中国香港','中国澳门','中国台湾','日本','新加坡','美国','英国','德国','其他'])].map(v=>opt(v,v||'不公开',draft.location||'')).join('')}</select></div></div></form>${orgDanger()}`}

function accountPage(){const m=M.member(s),p=s.profiles[s.user],countries=['中国','日本','美国','新加坡','英国','德国','其他'];return head('常规','管理身份信息、个人资料与应用偏好。')+section('身份信息（只读）',`<div class="identity-row"><span>邮箱</span><strong>${esc(m?.email||s.accounts?.find(a=>a.id===s.user)?.email||'未记录邮箱')}</strong></div><div class="identity-row"><span>账户 ID</span><strong>${esc(s.user)}</strong></div>${infoTip('不可修改，如需变更联系客服。')}`)+section('个人资料',`<form id="account-profile-form"><div id="account-avatar-preview">${avatarEditor(p,'account-draft')}</div><label class="field">显示名称<input name="name" required maxlength="40" value="${esc(p.name||m?.name||'')}"></label><label class="field">简介<textarea name="bio" maxlength="500">${esc(p.bio||'')}</textarea></label><label class="field">机构 / 院校 / 部门<input name="institution" maxlength="200" value="${esc(p.institution||'')}"></label><label class="field">网站<input type="url" name="website" maxlength="200" placeholder="https://" value="${esc(p.website||'')}"></label><div class="account-form-error" role="alert"></div><button class="primary">保存资料</button></form>`)+section('地区设置',`${infoTip('账号国家用于账单与合规；公开地区展示在个人主页。')}<form id="account-region-form"><label class="field">账号国家<select name="country">${options([...new Set([s.country,...countries])],s.country)}</select></label><label class="field">公开地区<select name="location">${[...new Set(['',p.location||'',...countries])].map(v=>opt(v,v||'不公开',p.location||'')).join('')}</select></label><div class="account-form-error" role="alert"></div><button>保存地区设置</button></form>`)+section('应用偏好',`<label class="field">外观<select id="preference-theme">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([k,t])=>opt(k,t,localStorage.getItem('swanlab-theme-demo-b')||'system')).join('')}</select></label><label class="field">界面语言<select id="preference-language"><option value="zh-CN">简体中文</option></select></label>`)}

function devPanel(){return `<aside class="devpanel" aria-label="原型验证面板"><div class="row between"><h3>原型验证面板</h3>${badge('工具')}</div><label class="field">演示身份<select id="dev-user">${o().members.map(m=>opt(m.id,m.name+' · '+m.role+(m.status==='disabled'?' · 已禁用':''),s.user)).join('')}${opt('anonymous','匿名访客',s.user)}</select></label><label class="field">数据集<select id="dev-dataset">${s.orgs.map(x=>opt(x.id,x.id==='free'?'免费 · 9 已加入 + 1 待邀请':x.id==='paid'?'付费 · 12 成员 · 区域 B':x.id==='trial'?'存量过渡 · 12 + 1':x.name,s.orgId)).join('')}</select></label><label class="field">容量状态<select id="dev-usage">${opt('','选择容量场景','')}${opt('5','正常 · 5 / 10 GB','')}${opt('8','预警 · 8 / 10 GB','')}${opt('10','满额 · 10 / 10 GB','')}</select><small>该场景会将当前组织恢复为免费 10 GB。</small></label><label class="field">模拟时间（北京时间）<input id="dev-time" type="datetime-local" value="${new Date(Date.parse(s.now)+8*36e5).toISOString().slice(0,16)}"></label><label class="checkrow"><input id="dev-region" type="checkbox" ${s.regionFailure?'checked':''}><span>模拟区域不可用</span></label><label class="checkrow"><input id="dev-failure" type="checkbox" ${s.requestFailure?'checked':''}><span>模拟读取 / 表单失败</span></label><div class="row wrap" style="margin-top:15px">${btn('重置全部演示数据','reset','small danger')}${btn('空白新用户','auth','small')}<button id="dev-load" class="small">模拟加载</button></div><details><summary>当前数据与原型假设</summary><p>SDK 演示 endpoint：https://mock.swanlab.invalid/${o().region}；写入结果通过「模拟记录实验」验证，无真实网络请求。</p><p>A02/A03：管理者治理权与权限取较高来源。A04/A05：80% 预警，满额阻断新增写入。A06：邀请 7 天有效；禁用不占名额。A07–09：自然月过渡与手动恢复。A12：目标容量替换。A13：内部资源动作。A14：Owner 双方确认。其余 A01–A14 见 PRD 与交付说明。</p><pre>${esc(JSON.stringify({user:s.user,slots:M.countMemberSlots(o()),usage:M.checkCapacity(o()),now:s.now,region:o().region,orders:o().orders},null,2))}</pre></details></aside>`}
let restoreFocus;
function modal(title,body,footer='',setup){const d=$('#modal');restoreFocus=document.activeElement;d.className='';d.setAttribute('aria-labelledby','modal-title');d.removeAttribute('aria-describedby');d.innerHTML=`<div class="modalhead"><h2 id="modal-title">${title}</h2>${btn(icon('close'),'close','ghost small','aria-label="关闭对话框"')}</div><div class="modalbody">${body}<div id="modal-error" role="alert"></div></div>${footer?`<div class="modalfoot">${footer}</div>`:''}`;if(!d.open)d.showModal();bind(d);setup?.(d);(d.querySelector('input:not([disabled]),textarea,select')||d.querySelector('button'))?.focus();}
function close(){const d=$('#modal');if(d.querySelector('#org-form')){ui.orgDirty=false;ui.orgAvatar=undefined;ui.orgDraft=undefined;}d.close();restoreFocus?.focus()}
$('#modal').addEventListener('close',()=>{if($('#modal').querySelector('#org-form')){ui.orgDirty=false;ui.orgAvatar=undefined;ui.orgDraft=undefined;}restoreFocus?.focus()});
function formError(e){$('#modal-error').innerHTML=`<div class="error">${icon('info')}<span>${esc(e.message)}</span></div>`}
function confirmDialog(title,body,action){const label=title.replace(/[？?]$/,'').replace(/^确认/,'');const danger=/删除|移出|退出|撤销|撤回|禁用|重置/.test(title);modal(title,`<p id="confirm-consequence">${body}</p>`,btn('取消','close')+btn(label,'confirm',danger?'danger':'primary','aria-describedby="confirm-consequence"'));$('#modal').setAttribute('aria-describedby','confirm-consequence');$('#modal [data-action="close"]')?.focus();$('#modal [data-action="confirm"]').onclick=()=>{try{action();save();close();render()}catch(e){formError(e)}};}
function projectForm(id){const fromAdmin=s.page==='projectAdmin';const p=o().projects.find(p=>p.id===id),editing=!!p;if(editing&&!can('manage',p)||!editing&&!can('create'))return toast('你没有项目管理权限');const active=o().members.filter(m=>m.status==='active');
 modal(editing?'项目设置':'创建项目',`<form id="project-form"><label class="field">项目名称<input name="name" required maxlength="80" value="${esc(p?.name||'')}" placeholder="例如：Qwen3 指令微调">${infoTip('同组织内名称唯一，最多 80 字符。')}</label><label class="field">描述<textarea name="desc" maxlength="500" placeholder="描述这个项目的研究目标…">${esc(p?.desc||'')}</textarea></label><label class="field">所属组织<input value="${esc(o().name)}" readonly></label><label class="field">可见范围<select name="scope" id="form-scope">${Object.entries(scopes).map(([k,v])=>opt(k,v,p?.scope||'SPACE')).join('')}</select></label><div id="scope-note" class="note"></div><details id="project-member-roles" open><summary>内部成员与项目角色</summary>${infoTip('只能选择有效组织成员。外部邮箱需先邀请加入组织。')}<div style="max-height:190px;overflow:auto">${active.map(m=>`<div class="checkrow"><label class="row" style="flex:1"><input type="checkbox" name="pmember" value="${m.id}" ${(p?.members[m.id]||!p&&m.id===s.user)?'checked':''} ${!p&&m.id===s.user?'disabled':''}><span>${esc(m.name)} <small>${m.role}</small></span></label><select name="role-${m.id}" aria-label="${m.name}的项目角色">${options(['管理','贡献','查看'],p?.members[m.id]||(!p&&m.id===s.user?'管理':'查看'))}</select></div>`).join('')}</div></details><div style="margin-top:20px"><span class="fieldtitle">项目标签</span><div class="tagchoices">${o().tags.map(t=>`<label class="tagchoice"><input name="tags" type="checkbox" value="${esc(t)}" ${p?.tags.includes(t)?'checked':''}>${tagMarkup(t,typeof org!=='undefined'?org:o())}</label>`).join('')||'<small>当前组织暂无标签，可在「所有项目」中管理标签。</small>'}</div></div><label class="checkrow"><input name="simulate-failure" type="checkbox"><span>模拟本次保存失败（验证工具）</span></label></form>`,btn('取消','close')+`<button class="primary" type="submit" form="project-form">${editing?'保存项目':'创建并进入项目'}</button>`,()=>{
 const note=()=>{const scope=$('#form-scope').value;$('#scope-note').textContent={MEMBERS:'仅指定成员及本组织管理者可访问。',SPACE:'组织内所有有效成员都能读取；贡献者可记录实验。',PUBLIC_READONLY:'所有人可读取概览与数值。公开访客无法获取内部名单、原文件、媒体和导出。'}[scope];$('#project-member-roles').hidden=scope!=='MEMBERS';};note();$('#form-scope').onchange=note;
 $('#project-form').onsubmit=e=>{e.preventDefault();try{if(s.requestFailure)throw Error('保存失败，输入已保留。请关闭验证面板的失败模拟后重试。');const f=new FormData(e.target),members={};if(f.has('simulate-failure'))throw Error('模拟保存失败，输入已保留。取消勾选后可重新保存。');active.forEach(m=>{if(f.getAll('pmember').includes(m.id)||!p&&m.id===s.user)members[m.id]=f.get('role-'+m.id)});const data={name:f.get('name').trim(),desc:f.get('desc'),scope:f.get('scope'),tags:f.getAll('tags'),members};if(!data.name||data.name.length>80)throw Error('项目名称必填，最多 80 字符');if(o().projects.some(x=>x.id!==id&&x.name===data.name))throw Error('同组织已存在同名项目');const ranks={MEMBERS:0,SPACE:1,PUBLIC_READONLY:2};if(ranks[data.scope]>ranks[p?.scope||'SPACE']&&!window.confirm(data.scope==='PUBLIC_READONLY'?'范围将扩大到互联网所有人。仅公开摘要与数值，确认公开？':'范围将扩大到组织内所有有效成员。确认更改？'))return;let target;if(editing){Object.assign(p,data);p.updated=s.now.slice(0,10);target=p}else target=M.createProject(s,data);s.projectId=target.id;s.page=fromAdmin&&editing?'projectAdmin':'project';save();close();render();toast(editing?'项目已保存。访问权限已按组织、治理及直接授权重新计算。':'项目已创建，数据归当前组织所有。')}catch(err){formError(err)}};});if(editing&&fromAdmin){$('#modal').classList.add('role-drawer','project-permissions-drawer');$('#modal-title').textContent='可见性与权限';}}
function inviteForm(){if(!can('members'))return toast('没有成员管理权限');modal('邀请加入组织',inviteTabs('email')+`<form id="invite-form"><label class="field">受邀邮箱<input name="email" type="email" required placeholder="name@example.com"></label><label class="field">组织角色<select name="role">${options(M.isOwner(s)?['贡献者','查看者','管理员']:['贡献者','查看者'],'贡献者')}</select></label><div class="note">加入后可访问所有「组织成员可见」项目；指定成员项目仍需授权。管理员将能治理本组织所有项目。<br>当前 ${M.countMemberSlots(o())} / ${o().paid?'不限':10} 名额。待邀请立即占位，有效期 7 天。</div><small>模拟邀请，不发送真实邮件。</small></form>`,btn('取消','close')+`<button class="primary" form="invite-form">创建邀请</button>`,()=>{$('#invite-form').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);const inv=M.inviteMember(s,f.get('email'),f.get('role'));save();close();render();toast('邀请已创建 / 已存在，仅占一个名额。');previewInvite(inv.id)}catch(err){formError(err)}}})}
function previewInvite(id){const inv=o().invites.find(i=>i.id===id);if(!inv)return;modal('你收到一个空间邀请',`<div class="row" style="margin-bottom:18px"><span class="projectglyph">${icon('users')}</span><div><h3>${esc(o().name)}</h3><p>${o().region==='region-a'?'演示区域 A':'演示区域 B'}</p></div></div><div class="note">受邀邮箱：${esc(inv.email)}<br>组织角色：${inv.role}<br>加入后可访问组织成员可见项目，不自动获得所有指定成员项目授权。<br>待邀请转为已加入，名额不会增加。</div><form id="accept-form"><label class="field">当前登录邮箱（可修改以验证身份不匹配）<input type="email" name="email" value="${esc(inv.email)}" required></label><label class="field">账号国家<select name="country">${options(['中国','日本','美国','新加坡'],s.country)}</select>${infoTip('国家不限制接受邀请，组织数据区保持不变。')}</label></form><p>邀请状态：${{pending:'待接受',accepted:'已接受',revoked:'已撤回',expired:'已过期'}[inv.status]} · 到期 ${inv.expires.slice(0,10)}</p>`,btn('暂不接受','close')+`<button class="primary" form="accept-form">${inv.status==='accepted'?'进入组织':'接受并进入组织'}</button>`,()=>{$('#accept-form').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);M.acceptInvite(s,id,f.get('email'));s.country=f.get('country');s.page='projects';save();close();render();toast('已加入目标空间，原待邀请名额转为成员名额。')}catch(err){formError(err)}}})}
function buy(){if(!M.isOwner(s))return toast('仅 Owner 可购买容量');modal('选择组织目标容量',`<p>为 ${esc(o().name)} 购买存储，付费组织成员人数不限。</p><div class="row wrap" style="margin:20px 0">${M.CONFIG.plans.map(p=>`<div class="plan"><span>${p.gb} GB</span><strong>¥${p.price}<small> / 月</small></strong><p>演示价格 · 非正式定价</p>${btn(p.gb*1e9>o().capacity?'选择 '+p.gb+' GB':'当前或更低容量','choosePlan','primary small',`data-gb="${p.gb}" data-price="${p.price}" ${p.gb*1e9<=o().capacity?'disabled':''}`)}</div>`).join('')}</div><div class="note">购买成功后总额度替换为所选目标容量，不与现有容量叠加。<br>模拟支付，不产生真实扣款；续费、税费及退款待正式确认。</div>`)}
function orderModal(id){const order=o().orders.find(x=>x.id===id);modal('模拟支付 · 订单确认',`<p>组织：<strong>${esc(o().name)}</strong></p><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>目标总容量</small><div class="value">${order.gb} GB</div></div><div class="stat"><small>演示价格</small><div class="value">¥${order.price}<small>/月</small></div></div><p>确认后，总容量替换为 ${order.gb} GB，成员人数不限；原有数据和权限保留。</p><div class="note">模拟支付，不产生真实扣款。订单 ${order.id}<br>当前状态：${order.status}。只有成功结果会更新权益；重复成功不重复扩容。</div><div class="row wrap">${[['success','确认模拟支付'],['failed','模拟失败'],['cancelled','取消支付'],['processing','保持处理中']].map(([v,t])=>btn(t,'pay',v==='success'?'primary':'',`data-id="${id}" data-value="${v}"`)).join('')}</div>`)}

function bind(root=document){accessibleHelp(root);bindExtra(root);root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset));
 const on=(id,event,fn)=>{const el=root.querySelector('#'+id);if(el)el.addEventListener(event,fn)};
 on('org-switch','change',e=>switchOrg(e.target.value));on('dev-dataset','change',e=>switchOrg(e.target.value));
 on('search','input',e=>{ui.search=e.target.value;let start=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(start,start)});
 [['scope-filter','scope'],['tag-filter','tag'],['sort','sort']].forEach(([id,k])=>on(id,'change',e=>{ui[k]=e.target.value;render()}));
 on('dev-load','click',()=>{ui.loading=true;render();setTimeout(()=>{ui.loading=false;render();toast('演示加载完成，布局与数据已恢复')},1400)});on('dev-user','change',e=>{s.user=e.target.value;save();render()});on('dev-usage','change',e=>{if(e.target.value){if(!o().projects.length){toast('请先选择带有项目的演示数据集');return}o().paid=false;o().capacity=1e10;M.setUsage(o(),+e.target.value);save();render()}});
 on('dev-time','change',e=>{if(e.target.value){s.now=e.target.value+':00+08:00';M.expireInvites(s);M.finalizeMigrationTrial(s);save();render()}});
 on('dev-region','change',e=>{s.regionFailure=e.target.checked;s.failureRegion=o().region;save();render()});on('dev-failure','change',e=>{s.requestFailure=e.target.checked;save();render()});
 root.querySelectorAll('[data-member-role]').forEach(el=>el.onchange=()=>{run(()=>{if(!can('members')||!M.isOwner(s)&&el.value==='管理员')throw Error('无权任免管理员');const m=o().members.find(m=>m.id===el.dataset.memberRole);if(m.role==='Owner')throw Error('Owner 只能通过转移流程交接');m.role=el.value;toast(el.value==='管理员'?'已设为管理员，将获得本组织所有项目治理权限。':'角色已更新，现有项目直接授权仍参与计算。')})});
 root.querySelectorAll('[data-keep]').forEach(el=>el.onchange=()=>run(()=>{if(!can('migration')||o().trial.finalized)throw Error('当前不可修改');const keep=o().trial.keep;if(el.checked&&keep.length>=10)throw Error('最多保留 10 个对象，Owner 必须保留');o().trial.keep=el.checked?[...keep,el.dataset.keep]:keep.filter(x=>x!==el.dataset.keep);toast('到期保留名单已保存')}));
 on('org-form','submit',e=>{e.preventDefault();try{if(!M.isOwner(s))throw Error('仅 Owner 可保存');const f=new FormData(e.target),name=f.get('name').trim();if(!name)throw Error('组织名称不能为空');if(s.requestFailure)throw Error('保存失败，更改已保留，请重试');o().name=name;if(ui.orgAvatar!==undefined)o().avatar=ui.orgAvatar;o().details=Object.fromEntries(['bio','institution','website','location'].map(k=>[k,f.get(k)||'']));save();ui.orgDirty=false;ui.orgAvatar=undefined;ui.orgDraft=undefined;ui.editOrgProfile=false;if($('#modal').open)close();render();toast('组织信息已保存')}catch(err){toast(err.message)}});
 on('display-name-form','submit',e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name)return;run(()=>{s.profiles[s.user].name=name;s.orgs.forEach(org=>org.members.filter(m=>m.id===s.user).forEach(m=>m.name=name));toast('显示名称已保存')})});
 on('country-form','submit',e=>{e.preventDefault();run(()=>{if(s.requestFailure||new FormData(e.target).has('simulate-failure'))throw Error('国家保存失败，原国家保持。请重试');s.country=new FormData(e.target).get('country');toast('账号国家已保存。组织权限、容量、账单与数据区保持。')})});}
function switchOrg(id){s.orgId=id;s.page='orgOverview';ui.search='';ui.scope=ui.tag='all';save();render();toast('已按目标组织数据区加载 · '+o().region)}
function action(a,d){document.querySelectorAll('.project-card-menu[open]').forEach(menu=>menu.open=false);if(ui.orgDirty&&['nav','open','switchOrg','logout','addAccount','create'].includes(a)){if(!window.confirm('组织信息尚未保存，确定放弃更改？'))return;ui.orgDirty=false;ui.orgAvatar=undefined;ui.orgDraft=undefined;}if(extraAction(a,d))return;switch(a){case'addLegacy':legacyAddForm(d.id);break;case'accountMenu':toggleAccountMenu();break;case'theme':setTheme(d.value);break;case'addAccount':$('#account-menu')?.hidePopover();s.page='auth';ui.addAccount=true;save();render();break;case'logout':$('#account-menu')?.hidePopover();M.signOut(s);ui.addAccount=false;save();render();toast(s.loggedOut?'已退出演示账号':'已退出当前账号，切换至另一个已登录账号');break;case'activateAccount':run(()=>M.activateAccount(s,d.id));break;case'profileTab':ui.profileTab=d.value;render();break;case'switchOrg':switchOrg(d.id);break;case'nav':s.page=d.page;save();render();focusContent();break;case'open':if(d.org)s.orgId=d.org;s.projectId=d.id;s.page='project';save();render();focusContent();break;case'create':projectForm();break;case'edit':projectForm(d.id);break;case'close':close();break;case'view':ui.view=d.value;s.profiles[s.user].projectView=d.value;save();render();break;case'clear':ui.search='';ui.scope=ui.tag='all';render();break;case'membertab':ui.tab=d.value;render();break;case'dev':ui.dev=!ui.dev;render();break;case'retry':s.regionFailure=false;s.requestFailure=false;save();render();toast('已重新连接，状态保持');break;case'invite':inviteForm();break;case'previewInvite':previewInvite(d.id);break;case'revoke':confirmDialog('撤回邀请？','撤回后链接不再有效，释放一个待邀请名额。',()=>{if(!can('members'))throw Error('无权限');o().invites.find(i=>i.id===d.id).status='revoked';toast('邀请已撤回，名额已释放')});break;case'reinvite':run(()=>{const inv=o().invites.find(i=>i.id===d.id);M.inviteMember(s,inv.email,inv.role);toast('已重新创建邀请')});break;case'memberstatus':confirmDialog(d.value==='active'?'恢复空间协作？':'禁用本组织协作？',d.value==='active'?'恢复后沿用已有项目授权，重新获得组织成员可见项目访问权。':'仅影响本组织。历史数据、账号与其他组 function commandPalette(){
 modal('快速跳转',`<div class="command-search">${icon('search')}<input id="command-search" type="text" role="combobox" aria-label="搜索项目、组织或页面" aria-autocomplete="list" aria-expanded="true" aria-controls="command-results" placeholder="Go to… 搜索项目、组织或页面" autocomplete="off"></div><div id="command-results" role="listbox" aria-label="搜索结果"></div><div class="command-hint"><span>↑ ↓ 选择</span><span>↵ 打开</span><span>Esc 关闭</span></div>`, '',()=>{
  $('#modal').classList.add('command-dialog');const input=$('#command-search');let entries=[],selected=0;
  function choose(entry){if(!entry)return;close();if(entry.orgId)s.orgId=entry.orgId;s.page=entry.projectId?'project':entry.page||'projects';if(entry.projectId)s.projectId=entry.projectId;ui.search='';ui.scope=ui.tag='all';save();render();focusContent();}
  function highlight(){const rows=$('#command-results').querySelectorAll('[role=option]');rows.forEach((row,i)=>{row.setAttribute('aria-selected',String(i===selected));row.classList.toggle('chosen',i===selected)});if(rows[selected]){input.setAttribute('aria-activedescendant',rows[selected].id);rows[selected].scrollIntoView({block:'nearest'})}else input.removeAttribute('aria-activedescendant');}
  function results(){entries=M.searchDestinations(s,input.value);selected=0;let group='';$('#command-results').innerHTML=entries.map((entry,i)=>{const label=entry.group!==group?`<div class="command-group" role="presentation">${esc(entry.group)}</div>`:'';group=entry.group;return label+`<button type="button" role="option" id="command-option-${i}" aria-selected="${i===0}" tabindex="-1" class="command-result" data-result="${i}"><span class="command-icon">${icon(entry.icon)}</span><span><strong>${esc(entry.label)}</strong><small>${esc(entry.detail)}</small></span><span class="command-enter">↵</span></button>`}).join('')||'<div class="command-empty">没有匹配的结果<br></div>';$('#command-results').querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>choose(entries[+el.dataset.result]));highlight();}
  input.oninput=results;input.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(entries.length)selected=(selected+(e.key==='ArrowDown'?1:-1)+entries.length)%entries.length;highlight()}if(e.key==='Enter'){e.preventDefault();choose(entries[selected])}};results();input.focus();
 });
}
document.addEventListener('keydown',e=>{if(!s.loggedOut&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const d=$('#modal');if(d.open){if(d.classList.contains('command-dialog'))close();return;}commandPalette();}});
function manageTags(){
 if(!can('categories'))return toast('仅组织管理者可管理标签');
 modal('管理项目标签',`<div class="row between" style="margin-bottom:20px">${btn(icon('plus')+' 新建标签','tagForm','small')}</div><div class="tag-manager">${o().tags.map(t=>`<div class="tag-manager-row">${tagMarkup(t)}<small>${visible().filter(p=>p.tags.includes(t)).length} 个项目</small><div>${btn('编辑','tagForm','small ghost',`data-name="${esc(t)}"`)}${btn('删除','deleteTag','small ghost',`data-name="${esc(t)}"`)}</div></div>`).join('')||'<div class="command-empty">还没有标签，先创建第一个。</div>'}</div>`);
}
const tagPalette=["#e54d2e","#e5484d","#e54666","#e93d82","#d6409f","#ab4aba","#8e4ec6","#6e56cf","#5b5bd6","#3e63dd","#0090ff","#00a2c7","#12a594","#29a383","#30a46c","#46a758","#ad7f58","#a18072","#978365","#f76b15","#ffc53d","#ffe629","#bdee63","#86ead4","#7ce2fe","#8d8d8d"];
function tagMarkup(name,org=o()){const color=org.tagColors?.[name];if(!/^#[0-9a-f]{6}$/i.test(color||''))return `<span class="tag">${esc(name)}</span>`;const rgb=color.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4),lum=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;return `<span class="tag colored-tag" style="--tag-color:${color};--tag-ink:${lum>.179?'#000000':'#ffffff'}">${esc(name)}</span>`;}
function tagForm(name){if(!can('categories'))return;const initial=o().tagColors?.[name]||'#0090ff';modal(name?'编辑标签':'新建标签',`<form id="tag-form"><label class="field">标签名称<input name="name" value="${esc(name||'')}" required maxlength="40" placeholder="例如：Benchmark"></label><div class="tag-color-field" role="group" aria-labelledby="tag-color-label"><span id="tag-color-label">标签颜色</span><div class="tag-color-controls"><div class="tag-palette" role="group" aria-label="预设颜色">${tagPalette.map(c=>`<button type="button" class="tag-color-swatch" style="--swatch:${c}" data-color="${c}" aria-label="选择颜色 ${c}" aria-pressed="${c===initial}"></button>`).join('')}</div><div class="tag-color-custom"><input type="color" id="tag-color-picker" aria-label="自定义标签颜色" value="${initial}"><input name="color" id="tag-color-value" aria-label="十六进制颜色" value="${initial}" pattern="#[0-9a-fA-F]{6}" required maxlength="7" placeholder="#6699cc"></div></div></div></form>`,btn('取消','close')+'<button class="primary" form="tag-form">保存标签</button>',()=>{const form=$('#tag-form'),hex=$('#tag-color-value'),picker=$('#tag-color-picker');const update=color=>{hex.value=color;picker.value=color;form.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===color.toLowerCase())));};form.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>update(b.dataset.color));picker.oninput=()=>update(picker.value);hex.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))update(hex.value)};update(initial);form.onsubmit=e=>{e.preventDefault();try{const value=M.saveTag(s,name,form.elements.name.value,hex.value);if(ui.tag===name)ui.tag=value;save();close();render();manageTags();toast('标签名称与颜色已保存')}catch(err){formError(err)}};});}
function projectTags(id,orgId){
 const org=s.orgs.find(o=>o.id===orgId)||o(),p=org.projects.find(p=>p.id===id);if(!p||!M.canPerformAction(s,'manage',p,org))return toast('只有项目管理者可编辑项目标签');
 modal('编辑项目标签',`<p style="margin-bottom:20px">${esc(p.name)} · ${esc(org.name)}</p><form id="project-tags-form"><div class="tagchoices">${org.tags.map(t=>`<label class="tagchoice"><input type="checkbox" name="tags" value="${esc(t)}" ${p.tags.includes(t)?'checked':''}>${tagMarkup(t,typeof org!=='undefined'?org:o())}</label>`).join('')||'<p>当前组织暂无标签。请先在「所有项目」中创建标签。</p>'}</div></form>`,btn('取消','close')+'<button class="primary" form="project-tags-form">保存项目标签</button>',()=>{$('#project-tags-form').onsubmit=e=>{e.preventDefault();try{M.setProjectTags(s,id,new FormData(e.target).getAll('tags'),org.id);save();close();render();toast('项目标签已更新')}catch(err){formError(err)}}});
}

${org.region==='region-a'?'演示区域 A':'演示区域 B'}</small></span>${icon('chevron')}</button>`).join('')||'<p>你还未加入任何组织。</p>'}</div></aside></div>`;

function profileFields(data={}){return [['bio','简介'],['institution','机构 / 院校 / 部门'],['website','网站'],['location','公开地区']].map(([k,t])=>`<label class="field">${t}<input name="${k}" value="${esc(data[k]||'')}" ${k==='website'?'type="url" placeholder="https://"':''}></label>`).join('')}
function orgProfileFields(){return `${avatarEditor(o(),'organization')}${profileFields(o().details)}`}
function accountProfileFields(){const p=s.profiles[s.user];return section('头像',avatarEditor(p,'account'))+section('公开资料',`${infoTip('展示在个人主页，与账号国家、数据区及账单地区分别记录。')}<form id="public-profile-form">${profileFields(p)}<button>保存公开资料</button></form>`)+section('应用偏好',`<label class="field">外观<select id="preference-theme">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([k,t])=>opt(k,t,localStorage.getItem('swanlab-theme-demo-b')||'system')).join('')}</select></label>${infoTip('也可以从左下角账户菜单快捷切换。')}<label class="field" style="margin-top:16px">界面语言<input readonly value="简体中文 · 原型当前支持语言"></label>`)}
function securityPage(){const p=s.profiles[s.user];return head('登录与安全','以下操作仅在本地演示，不连接真实认证服务。')+section('登录密码',`<div class="settings-action-row"><div><h3>${p.passwordSet?'已设置演示密码':'尚未设置密码'}</h3><p>通过验证后设置新的登录密码。</p></div>${btn('设置 / 修改密码','demoPassword')}</div>`)+section('第三方登录',['GitHub','GitCode'].map(provider=>`<div class="settings-action-row security-row"><div><h3>${provider}</h3><p>${p.connections?.includes(provider)?'已连接（模拟）':'尚未连接'}</p></div>${btn(p.connections?.includes(provider)?'断开连接':'连接账户','connection','',`data-value="${provider}"`)}</div>`).join(''))}
function developerPage(){const p=s.profiles[s.user];return head('开发者设置','个人凭证用于身份认证，访问范围仍由目标组织和项目授权决定。')+section('API Key',`<p>仅生成无效的演示密钥，请勿用于真实 SDK。</p>${(p.keys||[]).map(k=>`<div class="settings-action-row security-row"><div><b>${esc(k.name)}</b><small>${ui.revealKey===k.id?esc(k.value):'demo_••••••••••••'} · 本地演示</small></div><div class="row">${btn('显示 / 隐藏','revealKey','small',`data-id="${k.id}"`)}${btn('复制','copyKey','small',`data-id="${k.id}"`)}${btn('撤销','revokeKey','small danger',`data-id="${k.id}"`)}</div></div>`).join('')||'<div class="note">暂无 API Key</div>'}${btn('创建 API Key','newKey','', 'style="margin-top:16px"')}`)+section('SDK 默认值',`<form id="sdk-form"><label class="field">默认组织<select name="defaultOrg">${opt('','每次显式指定',p.defaultOrg||'')}${s.orgs.filter(org=>M.member(s,org)).map(org=>opt(org.id,org.name,p.defaultOrg)).join('')}</select></label><label class="field">新建项目默认可见范围<select name="defaultScope">${Object.entries(scopes).map(([k,v])=>opt(k,v,p.defaultScope||'SPACE')).join('')}</select></label>${infoTip('显式参数优先；未指定时使用默认值。默认组织不可访问时要求重新选择，不自动写入其他组织。此处模拟偏好保存，不调用真实 SDK。')}<button>保存 SDK 默认值</button></form>`)}
function adminProjectsPage(){if(!M.isManager(s))return denied('项目管理');const ps=o().projects.filter(p=>(!ui.adminSearch||(p.name+' '+p.desc).toLowerCase().includes(ui.adminSearch.toLowerCase()))&&(!ui.adminScope||ui.adminScope==='all'||p.scope===ui.adminScope)).sort((a,b)=>Number(isPinned(b))-Number(isPinned(a))||(ui.adminSort==='name'?a.name.localeCompare(b.name,'zh'):ui.adminSort==='created'?(b.createdAt||b.updated).localeCompare(a.createdAt||a.updated):(b.lastExperimentAt||'').localeCompare(a.lastExperimentAt||'')));return head('项目管理','治理当前组织的全部项目，统一管理可见性、权限与删除。',btn('项目回收站','nav','','data-page="trash"'))+`<div class="toolbar admin-project-toolbar"><div class="search">${icon('search')}<input id="admin-search" aria-label="搜索管理项目" placeholder="搜索项目…" value="${esc(ui.adminSearch||'')}"></div><select id="admin-scope" aria-label="筛选可见范围">${opt('all','所有可见范围',ui.adminScope||'all')}${Object.entries(scopes).map(([k,v])=>opt(k,v,ui.adminScope)).join('')}</select><select id="admin-sort" aria-label="项目管理排序">${opt('updated','最近更新',ui.adminSort||'updated')}${opt('created','创建时间',ui.adminSort)}${opt('name','名称',ui.adminSort)}</select></div>${ps.length?`<div class="tablewrap"><table><thead><tr><th>项目</th><th>可见范围</th><th>直接授权</th><th>存储</th><th>操作</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${btn(esc(p.name),'open','projecttitle',`data-id="${p.id}"`)}</td><td>${scopeBadge(p)}</td><td>${Object.keys(p.members).length} 人</td><td>${fmt(p.bytes)} GB</td><td><div class="row">${btn('可见性与权限','edit','small',`data-id="${p.id}"`)}<details class="project-card-menu admin-project-menu"><summary aria-label="${esc(p.name)}的更多操作" title="更多操作">${icon('more')}</summary><div class="project-card-actions">${btn('移动','moveProject','ghost',`data-id="${p.id}"`)}${btn(isPinned(p)?'取消置顶':'置顶','pinProject','ghost',`data-id="${p.id}"`)}${btn('删除','trashProject','ghost danger',`data-id="${p.id}"`)}</div></details></div></td></tr>`).join('')}</tbody></table></div>`:empty('暂无匹配项目','调整搜索词，或从所有项目创建新项目。')}`}
function trashPage(){if(!M.isManager(s))return denied('项目回收站');const ps=o().recycle||[];return head('项目回收站','仅包含当前组织已删除的项目。')+`${infoTip('原型假设：项目及实验、文件一起保留，恢复前仍计入容量；保留期和自动清理规则待确认。演示不自动清理。')}${ps.length?`<div class="tablewrap"><table><thead><tr><th>项目</th><th>删除时间</th><th>存储</th><th>操作</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.deletedAt.slice(0,10)}</td><td>${fmt(p.bytes)} GB</td><td>${btn('恢复项目','restoreProject','small',`data-id="${p.id}"`)} ${btn('彻底删除','purgeProject','small danger',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('回收站为空','删除的项目会在这里集中展示，可恢复到原组织。')}`}
function usageTable(){return `<div class="tablewrap"><table><thead><tr><th>项目</th><th>存储占用</th><th></th></tr></thead><tbody>${o().projects.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.bytes)} GB</td><td>${btn('管理项目','nav','small ghost','data-page="projectAdmin"')}</td></tr>`).join('')}${o().recycle?.length?`<tr><td>回收站项目</td><td>${fmt(o().recycle.reduce((n,p)=>n+p.bytes,0))} GB</td><td>${btn('查看回收站','nav','small ghost','data-page="trash"')}</td></tr>`:''}</tbody></table></div>`}
function planSummary(){return billingContactsSection()+section('套餐与容量',`<div class="settings-action-row"><div><h3>${o().paid?'付费组织':'免费组织'} · ${fmt(o().capacity)} GB</h3><p>${o().paid?'成员人数不限':'最多 10 个成员名额，待邀请占位'} · 容量由组织共享</p></div>${btn('购买 / 扩容','buy')}</div>`)+section('私有化与企业许可证',`${infoTip('许可证绑定当前组织。申请与激活仅为本地模拟。')}<div class="settings-action-row" style="margin-top:16px"><b>${o().license?'演示许可证已激活':'未配置许可证'}</b>${btn(o().license?'查看许可证':'申请演示许可证','license')}</div>`)+section('账单信息',`<p>账单地区与主体：${esc(o().billing)}</p>${infoTip('续费、发票与退款规则待确认。以下订单均为模拟。')}`)}
function orgDanger(){return `<section class="organization-danger"><h2>组织归属与解散</h2><div class="panel"><div class="settings-action-row"><div><h3>转移 Owner</h3><p>当前 Owner：${esc(o().members.find(m=>m.id===o().owner)?.name)}。目标成员接受后完成交接。</p></div>${M.isOwner(s)?btn('转移 Owner','transfer','danger'):badge('仅 Owner 可操作')}</div>${o().transfer?`<div class="note">已发起转移，当前 Owner 仍有效。${btn('预览接收确认','acceptTransfer','small')}</div>`:''}<div class="settings-action-row danger-separator"><div><h3>解散组织</h3><p>解散将影响全部成员、项目与账单，请确认后继续。</p></div>${M.isOwner(s)?btn('解散组织','dissolveInfo','danger'):badge('仅 Owner 可操作')}</div></div></section>`}
function avatarEditor(data,target){return `<div class="row" style="margin-bottom:20px">${data.avatar?`<img class="settings-avatar" src="${data.avatar}" alt="头像">`:'<span class="avatar owner">'+esc((data.name||'组织').slice(-2))+'</span>'}<label class="field" style="margin:0">更换头像<input id="avatar-${target}" class="avatar-file-input" type="file" accept="image/png,image/jpeg,image/webp" data-avatar="${target}"><button type="button" data-action="chooseAccountAvatar" data-target="${target}">修改</button>${infoTip('仅保存在本地，最大 1 MB。')}</label></div>`;}
function bindExtra(root){root.querySelectorAll('.admin-project-menu').forEach(menu=>menu.addEventListener('toggle',()=>{if(!menu.open)return;root.querySelectorAll('.admin-project-menu[open]').forEach(other=>{if(other!==menu)other.open=false});const box=menu.querySelector('summary').getBoundingClientRect(),actions=menu.querySelector('.project-card-actions');actions.style.left=Math.max(8,Math.min(innerWidth-168,box.right-160))+'px';actions.style.top=Math.max(8,Math.min(innerHeight-actions.offsetHeight-8,box.bottom+4))+'px';}));setupOrgSavebar(root);root.querySelectorAll('[data-avatar]').forEach(el=>el.onchange=()=>{const f=el.files[0];if(!f)return;if(f.size>1048576||!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('请选择不超过 1 MB 的 PNG、JPEG 或 WebP 图片');return}const reader=new FileReader();reader.onload=()=>{if(el.dataset.avatar==='account-draft'){ui.accountAvatar=reader.result;const image=document.createElement('img');image.className='settings-avatar';image.src=reader.result;image.alt='头像预览';el.closest('.row').firstElementChild.replaceWith(image);return;}if(el.dataset.avatar==='organization'){if(!M.isOwner(s))return toast('仅 Owner 可修改组织头像');ui.orgAvatar=reader.result;ui.orgDirty=true;if($('#org-savebar'))$('#org-savebar').hidden=false;updateOrgDraftControls();const preview=$('#org-avatar-preview');if(preview)preview.innerHTML=`<img class="settings-avatar" src="${reader.result}" alt="组织头像预览">`;close();toast('头像已更新预览，保存更改后生效');return}run(()=>{if(el.dataset.avatar==='organization'&&!M.isOwner(s))throw Error('仅 Owner 可修改组织头像');if(el.dataset.avatar==='organization'){ui.orgAvatar=reader.result;ui.orgDirty=true;if($('#org-savebar'))$('#org-savebar').hidden=false;}else{s.profiles[s.user].avatar=reader.result;toast('头像已保存')}});};reader.readAsDataURL(f)});const on=(id,event,fn)=>root.querySelector('#'+id)?.addEventListener(event,fn);on('admin-scope','change',e=>{ui.adminScope=e.target.value;render()});on('admin-sort','change',e=>{ui.adminSort=e.target.value;render()});on('public-profile-form','submit',e=>{e.preventDefault();run(()=>Object.assign(s.profiles[s.user],Object.fromEntries(new FormData(e.target))));toast('公开资料已保存')});on('sdk-form','submit',e=>{e.preventDefault();run(()=>Object.assign(s.profiles[s.user],Object.fromEntries(new FormData(e.target))));toast('SDK 默认值已保存')});on('account-profile-form','submit',e=>{e.preventDefault();const error=e.target.querySelector('.account-form-error');try{if(s.requestFailure)throw Error('资料保存失败，请重试');const f=new FormData(e.target),name=f.get('name').trim();if(!name)throw Error('显示名称不能为空');Object.assign(s.profiles[s.user],{name,bio:f.get('bio'),institution:f.get('institution'),website:f.get('website')});if(ui.accountAvatar!==undefined)s.profiles[s.user].avatar=ui.accountAvatar;s.orgs.forEach(org=>org.members.filter(m=>m.id===s.user).forEach(m=>m.name=name));ui.accountAvatar=undefined;save();render();toast('个人资料已保存')}catch(err){error.textContent=err.message}});on('account-region-form','submit',e=>{e.preventDefault();const error=e.target.querySelector('.account-form-error');try{if(s.requestFailure)throw Error('地区设置保存失败，请重试');const f=new FormData(e.target);s.country=f.get('country');s.profiles[s.user].location=f.get('location');save();toast('地区设置已保存')}catch(err){error.textContent=err.message}});on('preference-language','change',e=>{s.profiles[s.user].language=e.target.value;save();toast('界面语言已生效')});on('preference-theme','change',e=>setTheme(e.target.value));on('admin-search','input',e=>{ui.adminSearch=e.target.value;render();$('#admin-search').focus()});}
function extraAction(a,d){const p=s.profiles[s.user];switch(a){case'chooseAccountAvatar':document.getElementById('avatar-'+d.target)?.click();return true;case'leaveOrganization':{const org=s.orgs.find(org=>org.id===d.id);if(org)confirmDialog('确认退出组织？',`退出 ${esc(org.name)} 后，你将失去该组织的成员身份及项目访问权限。历史实验记录保留，重新加入需接受邀请。独立的账单联系人身份不受影响。`,()=>M.leaveOrganization(s,d.id));}return true;case'rolePermissionsHelp':rolePermissionsDrawer();return true;case'roleDetails':roleDetails(d.id);return true;case'memberMenu':memberMenu(d.id);return true;case'removeMember':$('#member-actions')?.hidePopover();{const m=o().members.find(m=>m.id===d.id);if(m)confirmDialog('彻底移出成员？',`确认将 ${esc(m.name)} 移出当前组织？其组织成员身份和项目直接授权将被移除，历史实验记录与其他组织身份保留。如需再次加入，需重新邀请。独立的账单联系人身份保持不变。`,()=>M.removeMember(s,d.id));}return true;case'confirmMemberStatus':$('#member-actions')?.hidePopover();confirmMemberStatus(d.id,d.value);return true;
case'addBillingContact':billingContactForm();return true;case'removeBillingContact':confirmDialog('移除账单联系人？','仅停止向此联系人发送账单通知；成员身份、邀请状态和项目授权均保持不变。',()=>M.removeBillingContact(s,d.id));return true;
case'uploadOrgAvatar':uploadOrgAvatar();return true;case'editOrgProfile':editOrgProfileDialog();return true;case'cancelOrgChanges':ui.orgDirty=false;ui.orgAvatar=undefined;ui.orgDraft=undefined;ui.editOrgProfile=false;if($('#modal').open)close();render();return true;case'pinProject':run(()=>{p.pinned??=[];p.pinned=p.pinned.includes(d.id)?p.pinned.filter(id=>id!==d.id):[...p.pinned,d.id]});return true;case'moveProject':moveProjectForm(d.id,d.org);return true;
case'inviteMode':close();d.value==='email'?inviteForm():linkInviteForm();return true;case'copyInviteLink':copyInvitation(d.id);return true;case'revokeInviteLink':confirmDialog('撤销邀请链接？','撤销后原链接不能再用于加入组织。',()=>{if(!can('members'))throw Error('没有成员管理权限');o().linkInvites.find(x=>x.id===d.id).status='revoked'});return true;case'previewInviteLink':close();previewLinkInvite(d.id);return true;
case'orgMenu':toggleOrgMenu();return true;case'createOrg':$('#org-menu')?.hidePopover();createOrgForm();return true;
case'connection':run(()=>{p.connections??=[];p.connections=p.connections.includes(d.value)?p.connections.filter(v=>v!==d.value):[...p.connections,d.value]});toast('第三方连接状态已更新（模拟）');return true;
case'demoPassword':modal('设置演示密码','<p>不会读取或保存真实密码。点击下方按钮模拟完成邮箱验证及密码设置。</p>',btn('取消','close')+btn('模拟验证并设置成功','passwordDone','primary'));return true;
case'passwordDone':p.passwordSet=true;save();close();render();toast('演示密码状态已更新，未保存真实凭证');return true;
case'newKey':modal('创建演示 API Key','<form id="key-form"><label class="field">名称<input name="name" required maxlength="40" placeholder="例如：开发笔记本"></label></form>',btn('取消','close')+'<button form="key-form" class="primary">创建演示密钥</button>',()=>{$('#key-form').onsubmit=e=>{e.preventDefault();p.keys??=[];const id=String(Date.now());p.keys.push({id,name:new FormData(e.target).get('name'),value:'demo_invalid_'+id});save();close();render()}});return true;
case'revealKey':ui.revealKey=ui.revealKey===d.id?null:d.id;render();return true;
case'copyKey':navigator.clipboard.writeText(p.keys.find(k=>k.id===d.id).value).then(()=>toast('演示密钥已复制')).catch(()=>toast('浏览器不支持复制'));return true;
case'revokeKey':confirmDialog('撤销演示密钥？','撤销后该演示密钥立即失效，无法恢复；需要时可重新创建。此操作不影响其他密钥。',()=>{p.keys=p.keys.filter(k=>k.id!==d.id)});return true;
case'trashProject':confirmDialog('将项目移入回收站？','项目将从工作列表隐藏，已有访问及写入停止。实验和文件一并保留，仍计入组织容量。',()=>M.recycleProject(s,d.id));return true;
case'restoreProject':run(()=>M.restoreProject(s,d.id));toast('项目已恢复，原权限保留');return true;
case'purgeProject':confirmDialog('彻底删除演示项目？','该项目及其全部实验和文件将从本地演示数据中永久删除，无法恢复；占用的组织容量将释放。',()=>M.purgeProject(s,d.id));return true;
case'license':if(!M.isOwner(s)){toast('仅 Owner 可管理许可证');return true}if(o().license){modal('组织演示许可证',`<p>${esc(o().name)} · DEMO-LOCAL</p><div class="note">仅用于原型验证，无真实授权效力。</div>`)}else{confirmDialog('申请演示许可证','许可证将绑定当前组织；不发送申请、不产生扣款。',()=>{o().license=true})}return true;
case'dissolveInfo':if(!M.isOwner(s))return true;modal('确认解散组织？',`<div class="error">解散将影响 ${esc(o().name)} 的全部成员、项目和账单，请谨慎操作。</div><p style="margin-top:12px">当前为本地原型，仅演示确认流程，不删除组织数据；项目处置、未完成订单及数据保留规则仍待确定。</p>`,btn('取消','close')+btn('确认解散组织','confirmDissolve','danger'));return true;case'confirmDissolve':if(!M.isOwner(s))return true;close();toast('已确认解散操作（演示），组织数据未删除');return true;
default:return false;}}
function orgMenuMarkup(){return `<div id="org-menu" popover="auto" role="dialog" aria-label="切换组织"><div class="theme-label">切换组织</div>${s.orgs.filter(org=>M.member(s,org)).map(org=>btn(`<span class="org-symbol">${esc(org.name.slice(0,1))}</span><span>${esc(org.name)}</span>${org.id===s.orgId?icon('check'):''}`,'switchOrg','account-menu-item',`data-id="${esc(org.id)}" aria-current="${org.id===s.orgId?'true':'false'}"`)).join('')}<div class="account-menu-section">${btn(icon('plus')+' 创建组织','createOrg','account-menu-item')}</div></div>`}
function toggleOrgMenu(){const menu=$('#org-menu'),trigger=$('#org-menu-trigger');if(menu.matches(':popover-open')){menu.hidePopover();return}const rect=$('.orgpick').getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-308))+'px';menu.style.top=Math.min(rect.bottom+8,innerHeight-260)+'px';menu.showPopover();trigger.setAttribute('aria-expanded','true');menu.querySelector('button')?.focus();menu.ontoggle=e=>{if(e.newState==='closed'){trigger.setAttribute('aria-expanded','false');if(document.contains(trigger))trigger.focus()}};}
function createOrgForm(){modal('创建组织',`<form id="create-org-form"><label class="field">组织名称<input name="name" required maxlength="80" placeholder="例如：视觉智能实验室"></label><label class="field">组织数据区<select name="region">${opt('region-a','演示区域 A','region-a')}${opt('region-b','演示区域 B','region-a')}</select></label><div class="note">创建免费组织，初始容量 10 GB、最多 10 个成员名额。你将成为 Owner。组织数据区创建后不可修改；不产生真实费用。</div></form>`,btn('取消','close')+'<button class="primary" form="create-org-form">创建并进入组织</button>',()=>{$('#create-org-form').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);M.createOrganization(s,f.get('name'),f.get('region'));save();close();render();focusContent();toast('组织已创建')}catch(err){formError(err)}}})}
function orgOverviewPage(){const org=o(),projects=visible(),m=M.member(s),members=org.members.filter(m=>m.status==='active').length;return head('组织概览',esc(org.name)+' · 组织资料、协作与项目入口。',M.isManager(s)?btn('管理组织','nav','','data-page="settings"'):'')+`<section class="profile-hero"><div class="profile-avatar">${org.avatar?`<img src="${org.avatar}" alt="组织头像" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:esc(org.name.slice(0,1))}</div><div class="profile-info"><div class="row wrap"><h2>${esc(org.name)}</h2>${badge(org.paid?'付费组织':'免费组织')}</div><p style="margin-top:8px">${esc(org.details?.bio||'还没有填写组织简介。')}</p><p style="margin-top:8px">${esc([org.details?.institution,org.details?.location,org.details?.website].filter(Boolean).join(' · '))}</p><small>${org.region==='region-a'?'演示区域 A':'演示区域 B'} · 你的角色：${esc(m?.role||'无有效成员身份')}</small></div></section><div class="stats"><div class="stat"><small>可访问项目</small><div class="value">${projects.length}</div></div><div class="stat"><small>组织成员</small><div class="value">${members}</div></div><div class="stat"><small>${can('usage')?'组织存储':'组织数据区'}</small><div class="value">${can('usage')?fmt(org.used)+' <small>GB</small>':org.region==='region-a'?'区域 A':'区域 B'}</div><small>${can('usage')?'总容量 '+fmt(org.capacity)+' GB':'项目数据归当前组织所有'}</small></div></div><div class="row between" style="margin:28px 0 18px"><h2>最近更新的项目</h2>${btn('查看所有项目 '+icon('arrow'),'nav','ghost','data-page="projects"')}</div>${projects.length?`<div class="grid">${[...projects].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,3).map(p=>card(p)).join('')}</div>`:empty('从第一个项目开始','当前组织还没有你可访问的项目。',can('create')?btn('创建项目','create','primary'):'')}`}

function inviteTabs(active){return `<div class="tabs" role="tablist" aria-label="邀请方式">${[['email','邮箱邀请'],['link','链接邀请']].map(([v,t])=>btn(t,'inviteMode',v===active?'active':'',`data-value="${v}" role="tab" aria-selected="${v===active}"`)).join('')}</div>`}
function inviteLinkUrl(id){const u=new URL(location.href);u.search='';u.searchParams.set('inviteLink',id);return u.href;}
function linkInviteForm(){if(!can('members'))return toast('没有成员管理权限');const links=(o().linkInvites||[]).filter(x=>x.status==='active'&&Date.parse(x.expires)>Date.parse(s.now));modal('邀请加入组织',inviteTabs('link')+`<p>将链接分享给协作者，登录后确认加入当前组织。</p><form id="link-invite-form" style="margin-top:20px"><label class="field">加入后的组织角色<select name="role">${options(M.isOwner(s)?['贡献者','查看者','管理员']:['贡献者','查看者'],'贡献者')}</select></label><div class="note">原型假设：链接 7 天有效，可重复使用；生成链接不占名额，接受时检查组织名额。链接持有者可按所选角色加入，请谨慎分享。</div><button class="primary">生成邀请链接</button></form><div style="margin-top:24px">${links.map(x=>`<div class="panel"><div class="row between"><b>${esc(x.role)}</b><small>到期 ${x.expires.slice(0,10)}</small></div><label class="field" style="margin-top:12px">邀请链接<input readonly value="${esc(inviteLinkUrl(x.id))}"></label><div class="row wrap">${btn('复制链接','copyInviteLink','small',`data-id="${x.id}"`)}${btn('预览接受页面','previewInviteLink','small ghost',`data-id="${x.id}"`)}${btn('撤销链接','revokeInviteLink','small danger',`data-id="${x.id}"`)}</div></div>`).join('')||'<small>尚未生成有效链接。</small>'}</div><small>仅限同一浏览器内的本地演示，不发送真实邀请。</small>`,btn('完成','close'),()=>{$('#link-invite-form').onsubmit=e=>{e.preventDefault();try{M.createInviteLink(s,new FormData(e.target).get('role'));save();close();linkInviteForm()}catch(err){formError(err)}}})}
function previewLinkInvite(id){const org=s.orgs.find(org=>org.linkInvites?.some(x=>x.id===id)),link=org?.linkInvites.find(x=>x.id===id);if(!link)return modal('邀请链接不可用','<p>此链接未在当前浏览器的演示数据中找到。</p>');const valid=link.status==='active'&&Date.parse(link.expires)>Date.parse(s.now);modal('通过链接加入组织',`<h3>${esc(org.name)}</h3><p style="margin:12px 0">组织角色：${esc(link.role)} · ${org.region}</p>${valid?`<form id="redeem-link-form"><label class="field">演示登录邮箱<input name="email" type="email" required placeholder="name@example.com"></label><div class="note">登录并确认后加入组织，指定成员项目仍需额外授权。不发送真实邮件。</div></form>`:'<div class="note">邀请链接已撤销或过期，请联系管理员。</div>'}`,btn('取消','close')+(valid?'<button form="redeem-link-form" class="primary">确认加入组织</button>':''),()=>{if(valid)$('#redeem-link-form').onsubmit=e=>{e.preventDefault();try{M.redeemInviteLink(s,id,new FormData(e.target).get('email'));save();close();render();toast('已通过演示链接加入组织')}catch(err){formError(err)}}})}
if(route.has('inviteLink'))previewLinkInvite(route.get('inviteLink'));

async function copyInvitation(id){const button=$('#modal [data-action="copyInviteLink"][data-id="'+id+'"]'),value=inviteLinkUrl(id);try{await navigator.clipboard.writeText(value);if(button)button.textContent='已复制';}catch{const input=$('#modal input[readonly]');input?.focus();input?.select();const copied=document.execCommand('copy');if(button)button.textContent=copied?'已复制':'请按 ⌘C / Ctrl+C 复制';}}
function updateOrgDraftControls(){const actions=$('#org-header-actions');if(actions)actions.hidden=!ui.orgDirty;}
function setupOrgSavebar(root){const form=root.querySelector('#org-form');if(!form||!M.isOwner(s))return;const original={name:o().name,...o().details};const check=()=>{const values=Object.fromEntries(new FormData(form));if(s.page==='settings'&&!$('#modal').contains(form))ui.orgDraft=values;ui.orgDirty=Object.keys(values).some(k=>String(values[k])!==String(original[k]||''))||ui.orgAvatar!==undefined;if($('#org-savebar'))$('#org-savebar').hidden=!ui.orgDirty;updateOrgDraftControls();};form.addEventListener('input',check);form.addEventListener('change',check);}
function uploadOrgAvatar(){if(!M.isOwner(s))return;modal('更换组织头像',`<p>选择 PNG、JPEG 或 WebP 图片，大小不超过 1 MB。</p><label class="field" style="margin-top:20px">上传图片<input type="file" accept="image/png,image/jpeg,image/webp" data-avatar="organization"></label>`,btn('取消','close'));}
