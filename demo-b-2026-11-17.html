function moveProjectForm(id,orgId=s.orgId){const source=s.orgs.find(org=>org.id===orgId),p=source?.projects.find(p=>p.id===id);if(!p||!M.isManager(s,source))return toast('仅组织管理者可移动项目');const targets=s.orgs.filter(org=>org.id!==source.id&&M.isManager(s,org));modal('移动项目',`<p>${esc(p.name)} · 当前组织：${esc(source.name)}</p><form id="move-project-form" style="margin-top:20px"><label class="field">目标组织<select name="target" required><option value="">请选择目标组织</option>${targets.map(org=>opt(org.id,org.name+(org.region!==source.region?' · 跨区暂不支持':''),'')).join('')}</select></label><div class="note">原型规则：需同时拥有两个组织的管理权限；仅支持同数据区。项目数据与容量归属转到目标组织，保留可见范围；直接授权仅保留目标组织的有效成员，原组织成员将失去组织访问来源。目标容量不足或存在同名项目时不能移动。</div></form>`,btn('取消','close')+'<button form="move-project-form" class="primary">确认移动</button>',()=>{$('#move-project-form').onsubmit=e=>{e.preventDefault();try{const target=new FormData(e.target).get('target');M.moveProject(s,id,source.id,target);save();close();render();toast('项目已移动到目标组织')}catch(err){formError(err)}}})}


function editOrgProfileDialog(){if(!M.isOwner(s))return toast('仅 Owner 可编辑组织资料');modal('编辑组织资料',`<form id="org-form"><label class="field">组织名称<input name="name" required maxlength="80" value="${esc(o().name)}"></label>${orgProfileFields()}</form>`,btn('取消更改','cancelOrgChanges')+'<button class="primary" form="org-form">保存更改</button>');}

function billingContactsSection(){const owner=M.isOwner(s);return section('账单联系人',`<div class="settings-action-row"><div><h3>账单通知接收人</h3></div>${owner?btn('添加账单联系人','addBillingContact'):''}</div>${(o().billingContacts||[]).map(c=>{const m=o().members.find(m=>m.email.toLowerCase()===c.email&&m.status==='active'),pending=o().invites.some(i=>i.email.toLowerCase()===c.email&&i.status==='pending');return `<div class="settings-action-row security-row"><div><b>${esc(c.name)}</b><small>${esc(c.email)}</small><div class="row" style="margin-top:8px">${m?badge(m.role):pending?badge('待接受邀请'):''}</div></div>${owner?btn('移除','removeBillingContact','small danger',`data-id="${esc(c.id)}"`):''}</div>`}).join('')||'<div class="note" style="margin-top:16px">暂无账单联系人。</div>'}${infoTip('仅 Owner 可管理。新增或移除联系人不改变成员身份、邀请状态或项目授权。仅作为联系人不占名额；兼具有效成员或待接受邮箱邀请身份时按成员规则计数，不重复占位。本地原型不发送真实邮件。')}`)}
function billingContactForm(){modal('添加账单联系人',`<form id="billing-contact-form"><label class="field">姓名<input name="name" required maxlength="40"></label><label class="field">邮箱<input name="email" type="email" required></label><div class="note">仅接收账单通知，不改变成员身份或权限。</div></form>`,btn('取消','close')+'<button class="primary" form="billing-contact-form">添加联系人</button>',()=>{$('#billing-contact-form').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target);M.addBillingContact(s,f.get('name'),f.get('email'));save();close();render();toast('账单联系人已添加，现有身份与权限保持不变')}catch(err){formError(err)}}})}

function roleDetails(id){const m=o().members.find(m=>m.id===id);if(!m)return;const descriptions={Owner:'拥有组织的全部治理权限，可管理成员和项目、购买容量、管理账单及转移 Owner。可访问并管理本组织全部项目。',管理员:'可管理组织成员与全部项目，包括项目可见性、授权和删除。不能转移 Owner 或执行仅 Owner 可操作的账单与组织操作。',贡献者:'可读取组织成员可见项目，并在其内记录实验；指定成员项目按单独授权访问。没有组织治理权限。',查看者:'可读取组织成员可见项目；不能新增实验。指定成员项目仍需授权。没有组织治理权限。'};modal('Role details',`<section class="role-detail-section"><h3>Account</h3><div class="row" style="margin-top:16px"><span class="avatar">${esc(m.name.slice(0,1))}</span><div><strong>${esc(m.name)}</strong><small style="display:block">ID: ${esc(m.id)}</small><small>${esc(m.email)}</small></div></div></section><section class="role-detail-section"><h3>Role</h3><p style="margin-top:12px">${esc(m.role==='管理员'?'管理者':m.role)}</p>${m.status==='active'&&m.role!=='Owner'&&(M.isOwner(s)||m.role!=='管理员')?`<label class="field" style="margin-top:16px">调整角色<select data-member-role="${m.id}">${options(roles.slice(1).filter(r=>M.isOwner(s)||r!=='管理员'),m.role)}</select></label>`:''}</section><section class="role-detail-section"><h3>Description</h3><p style="margin-top:12px">${esc(descriptions[m.role])}</p><div class="note">${m.status==='disabled'?'当前账户已在本组织禁用，以上角色权限暂不生效。':'项目直接授权可能提供额外的项目权限；组织角色与项目授权共同决定实际权限。'}</div></section>`,btn('关闭','close'));$('#modal').classList.add('role-drawer');$('#modal [data-member-role]')?.addEventListener('change',()=>{if($('#modal').open)close();roleDetails(id)});}
function memberMenu(id){const m=o().members.find(m=>m.id===id);if(!m||m.role==='Owner')return;document.querySelector('#member-actions')?.remove();const trigger=[...document.querySelectorAll('[data-action="memberMenu"]')].find(el=>el.dataset.id===id),menu=document.createElement('div');menu.id='member-actions';menu.setAttribute('popover','auto');menu.setAttribute('role','menu');const allowed=can('members')&&(M.isOwner(s)||m.role!=='管理员');menu.innerHTML=btn(m.status==='disabled'?'恢复账户':'禁用账户','confirmMemberStatus',m.status==='disabled'?'':'danger',`data-id="${id}" data-value="${m.status==='disabled'?'active':'disabled'}" role="menuitem" ${allowed?'':'disabled'}`);if(m.status==='disabled')menu.innerHTML+=btn('彻底移出','removeMember','danger',`data-id="${id}" role="menuitem" ${allowed?'':'disabled'}`);document.body.append(menu);bind(menu);const r=trigger.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(r.right-160,innerWidth-168))+'px';menu.style.top=Math.min(r.bottom+5,innerHeight-70)+'px';menu.showPopover();menu.querySelector('button').focus();menu.addEventListener('toggle',e=>{if(e.newState==='closed')trigger?.focus()});}
function confirmMemberStatus(id,status){const m=o().members.find(m=>m.id===id);if(!m)return;const disabling=status==='disabled';modal(disabling?'禁用账户？':'恢复账户？',`<div class="${disabling?'error':'note'}"><strong>${disabling?'此操作将立即停止该成员在本组织的数据访问和协作。':'恢复后成员将重新获得本组织协作权限。'}</strong></div><p style="margin-top:16px">${esc(m.name)} · ${esc(m.email)}</p><p style="margin-top:12px">${disabling?'仅在当前组织禁用，释放成员名额；历史数据和其他组织的访问不受影响。可从「已禁用」恢复账户。':'沿用原组织角色和项目授权，恢复后占用一个成员名额。'}</p>`,btn('取消','close')+btn(disabling?'确认禁用账户':'确认恢复账户','applyMemberStatus',disabling?'danger':'primary',`data-id="${id}" data-value="${status}"`),()=>{$('#modal [data-action="applyMemberStatus"]').onclick=()=>{try{M.setMemberStatus(s,id,status);save();close();render();toast(disabling?'账户已在当前组织禁用':'账户协作已恢复')}catch(err){formError(err)}}});}

function rolePermissionsDrawer(){if(!M.isManager(s))return;modal('角色与权限',rolePermissionsPage(true),btn('关闭','close'));$('#modal').classList.add('role-drawer','permissions-drawer');}
function rolePermissionsPage(drawer=false){if(!M.isManager(s))return denied('角色与权限');return (drawer?'':head('角色与权限','查看组织角色与资源级权限。'))+section('内置角色',`<div class="tablewrap"><table><thead><tr><th>角色</th><th>权限说明</th></tr></thead><tbody>${[['Owner','组织全部治理权限；管理成员与项目、购买容量、管理账单、转移 Owner。'],['管理者','管理组织成员和所有项目，可调整可见性、授权、移动及删除；不能执行仅 Owner 可用的操作。'],['贡献者','可读取组织成员可见项目并记录实验；指定成员项目需要直接授权。'],['查看者','可读取组织成员可见项目；不能记录实验。指定成员项目需要直接授权。'],['账单联系人（非成员角色）','用于接收账单通知，本身不授予数据或操作权限；可兼任任何组织角色，权限独立判定。仅联系人不占名额，兼具成员或待接受邮箱邀请身份不重复计数。']].map(([role,desc])=>`<tr><td><strong>${role}</strong></td><td style="white-space:normal">${desc}</td></tr>`).join('')}</tbody></table></div>`)+section('自定义角色',`<p>暂不支持自定义角色</p>`)+section('资源级权限',`<div class="tablewrap"><table><thead><tr><th>资源范围</th><th>访问与授权规则</th></tr></thead><tbody><tr><td>指定成员项目</td><td>由项目名单授予管理、贡献或查看权限；组织管理者拥有治理权限。</td></tr><tr><td>组织成员可见项目</td><td>有效组织成员可读取；贡献者可写入，查看者不可写入。</td></tr><tr><td>公开只读项目</td><td>访客仅可读取公开摘要与数值；不授予内部名单、媒体、原文件或导出权限。</td></tr><tr><td>禁用账户</td><td>本组织协作权限失效；历史记录与其他组织权限保持。</td></tr><tr><td>账单联系人</td><td>联系人身份不授予数据、购买、套餐变更或成员管理权限；可通过独立的组织角色和项目授权获得相应权限。仅 Owner 可管理联系人。</td></tr></tbody></table></div>${infoTip('组织角色与项目直接授权共同决定实际权限。资源权限的具体调整在项目管理的「可见性与权限」中完成。')}`)}

function myOrganizationsPage(){const rows=s.orgs.flatMap(org=>{const m=org.members.find(m=>m.id===s.user);return m?[{org,m}]:[]});return head('我的组织','查看你加入的组织、本人角色与成员状态。')+`<div class="tablewrap"><table><thead><tr><th>组织名称</th><th>本人角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(({org,m})=>`<tr><td>${esc(org.name)}</td><td>${esc(m.role)}</td><td>${badge(m.status==='active'?'正常':'已禁用')}</td><td>${m.role==='Owner'?'<small>请先转移 Owner 后退出</small>':btn('退出组织','leaveOrganization','small danger',`data-id="${org.id}"`)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('尚未加入组织','接受组织邀请后将在这里显示。')}`;}

function infoTip(text){const id='help-'+(++helpSequence);return `<span class="inline-help"><button type="button" class="info-tip-trigger" aria-label="查看补充说明" aria-describedby="${id}">${icon('info')}</button><span id="${id}" class="info-tip-content" role="tooltip">${esc(text)}</span></span>`;}
function accessibleHelp(root){root.querySelectorAll('label.field').forEach(label=>{const controls=label.querySelectorAll('input:not([type=hidden]),select,textarea');if(controls.length!==1)return;const control=controls[0];if(!control.id)control.id='field-'+(++helpSequence);label.htmlFor=control.id;const helpers=[...label.querySelectorAll('.inline-help')];if(!helpers.length)return;const textNodes=[...label.childNodes].filter(n=>n.nodeType===3),caption=textNodes.map(n=>n.textContent.trim()).join(' '),field=document.createElement('div');field.className=label.className;field.classList.add('field-help-row');const captionRow=document.createElement('span');captionRow.className='field-help-caption';const title=document.createElement('label');title.htmlFor=control.id;title.textContent=caption;captionRow.append(title);label.before(field);textNodes.forEach(n=>n.remove());field.append(captionRow);helpers.forEach(help=>{const tip=help.querySelector('[role=tooltip]');if(tip){const ids=new Set((control.getAttribute('aria-describedby')||'').split(' ').filter(Boolean));ids.add(tip.id);control.setAttribute('aria-describedby',[...ids].join(' '));}help.querySelector('button')?.setAttribute('aria-label',(caption||'字段')+'说明');captionRow.append(help);});field.append(...label.childNodes);label.remove();});root.querySelectorAll('.inline-help').forEach(help=>{if(!help.closest('.field-help-caption')){const section=help.closest('.setting-section'),panel=help.closest('.panel'),details=help.closest('details');let title=details?.querySelector('summary')||section?.querySelector('h2')||panel?.querySelector('h3');if(!title){const headings=[...root.querySelectorAll('h1,h2,h3,summary')];title=headings.filter(h=>!!(h.compareDocumentPosition(help)&Node.DOCUMENT_POSITION_FOLLOWING)).at(-1);}if(title){const caption=title.textContent.trim();title.append(help);help.querySelector('button')?.setAttribute('aria-label',caption+'说明');}}help.addEventListener('keydown',event=>{if(event.key==='Escape'){help.classList.add('help-dismissed');event.stopPropagation();}});help.addEventListener('pointerleave',()=>help.classList.remove('help-dismissed'));help.addEventListener('focusout',()=>help.classList.remove('help-dismissed'));});}

function cardUpdate(p,org){if(!p.lastExperimentAt||!p.lastExperimentBy)return '';const person=org.members.find(m=>m.id===p.lastExperimentBy),profile=s.profiles[p.lastExperimentBy],name=profile?.name||person?.name||'更新者';const minutes=Math.max(0,Math.floor((Date.parse(s.now)-Date.parse(p.lastExperimentAt))/60000));if(!Number.isFinite(minutes))return '';const relative=minutes<1?'刚刚':minutes<60?minutes+'分钟前':minutes<1440?Math.floor(minutes/60)+'小时前':Math.floor(minutes/1440)+'天前';return `<span class="card-update" aria-label="${esc(name)}，${relative}更新" title="${esc(name)} · ${esc(p.lastExperimentAt)}">${profile?.avatar?`<img class="update-avatar" src="${esc(profile.avatar)}" alt="${esc(name)}">`:`<span class="update-avatar" aria-hidden="true">${esc(name.slice(-2))}</span>`}<time datetime="${esc(p.lastExperimentAt)}">${relative}</time></span>`;}

function legacyMembersPage(){const org=o(),all=org.legacyCollaborators||[],waiting=all.filter(c=>c.status!=='added');return head('成员管理'+btn(icon('info'),'rolePermissionsHelp','ghost title-help','aria-label="查看角色与权限"'),' ',btn(icon('plus')+' 邀请成员','invite','primary'))+`<div class="tabs">${[['active','已加入',org.members.filter(m=>m.status==='active').length],['pending','待邀请',org.invites.filter(i=>i.status==='pending').length],['disabled','已禁用',org.members.filter(m=>m.status==='disabled').length],['legacy','旧有协作者',waiting.length]].map(([v,t,n])=>btn(`${t} <span class="muted">${n}</span>`,'membertab',v===ui.tab?'active':'',`data-value="${v}"`)).join('')}</div><p class="note">旧有协作者已移出项目。加入组织时可选择恢复原项目权限；组织角色权限独立生效。</p>${all.length?`<div class="tablewrap"><table><thead><tr><th>协作者 / 邮箱</th><th>原项目与权限</th><th>状态</th><th>操作</th></tr></thead><tbody>${all.map(c=>`<tr><td><div class="row"><span class="avatar">${esc(c.name.slice(0,1))}</span><div>${esc(c.name)}<small style="display:block">${esc(c.email)}</small></div></div></td><td>${c.grants.map(g=>{const p=org.projects.find(p=>p.id===g.projectId);return p?`<div>${esc(p.name)} · ${esc(g.role)}</div>`:''}).join('')||'—'}</td><td>${badge(c.status==='added'?'已加入组织':'已移出项目',c.status==='added'?'green':'')}</td><td>${c.status==='added'?'—':btn('加入组织','addLegacy','small',`data-id="${esc(c.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('暂无旧有协作者','')}`;}
function legacyAddForm(id){const c=o().legacyCollaborators.find(c=>c.id===id);if(!c)return;modal('加入组织',`<form id="legacy-add-form"><p>${esc(c.name)} · ${esc(c.email)}</p><label class="field">组织角色<select name="role">${options(['贡献者','查看者'],'贡献者')}</select></label><label class="checkrow"><input type="checkbox" name="restorePermissions" checked><span>恢复原项目权限</span></label><p class="note">将占用一个组织成员名额；已有成员或待邀请按邮箱去重。取消勾选后不恢复原项目授权，所选组织角色对应的权限仍会生效。</p></form>`,btn('取消','close')+'<button class="primary" form="legacy-add-form">加入组织</button>',()=>{$('#legacy-add-form').onsubmit=e=>{e.preventDefault();try{const f=new FormData(e.target),restore=f.has('restorePermissions');M.addLegacyCollaborator(s,id,f.get('role'),restore);save();close();render();toast(restore?'已加入组织，原项目权限已恢复':'已加入组织，未恢复原项目授权')}catch(err){formError(err)}}});}
</script></body></html>
